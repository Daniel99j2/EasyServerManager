<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <link rel="stylesheet" href="main.css">
    <link rel="icon" type="image/x-icon" href="icon.png">
</head>
<body>
<script type="text/javascript">
    let generalStream = new EventSource("%base%/event-stream", {
        withCredentials: true
    });
    generalStream.addEventListener("clear_logs", (e) => {
        document.getElementById("logDiv").replaceChildren();
        document.getElementById("logDiv").dataset.hasScrolled = false;
    });
    let running = false;
    generalStream.addEventListener("status", (e) => {
        let data = JSON.parse(e.data);
        document.getElementById("current-status").textContent = data["name"].toLowerCase().replace("_", " ").replace(/\b\w/g, char => char.toUpperCase());
        document.getElementById("current-status-circle").style["background-color"] = data["colour"];

        if(data.running) {
            running = true;
            document.getElementById("start-stop").className = "redbutton";
            document.getElementById("start-stop").textContent = "Stop";
        } else {
            running = false;
            document.getElementById("start-stop").className = "greenbutton";
            document.getElementById("start-stop").textContent = "Start";
        }
    });
    generalStream.addEventListener("players", (e) => {
        document.getElementById("player-list").innerHTML = "";
        let data = "";
        e.data.split(",").forEach((player) => {
            data += "<p>"+player+"</p>";
        });
        document.getElementById('player-list').innerHTML += data;
    });
    generalStream.onmessage = (event) => {
        console.log("Unknown message:", event.id);
    };
    generalStream.onerror = (error) => {
        console.error("Error in EventSource:", error);
    };

    async function startStop(event) {
        const request = new XMLHttpRequest();
        request.open("POST", running ? "api/stop" : "api/start");
        request.onload = async function () {
            if(request.status === 200) {
            }
        }
        request.send();
    }

    window.addEventListener("load", () => {
        login()
    })
</script>
<script src="%base%/password.js"></script>
<script src="%base%/logger.js"></script>
<sitetitle></sitetitle>
<sidebar></sidebar>
<h1>Your Account</h1>
<div style="display: flex; align-items: center; gap: 10px;">
<div class="circle" style="width: 10px; height: 10px; background-color: grey; border-radius: 50%;" id="current-status-circle"></div><p id="current-status">Offline</p>
</div>
<div class="dashboard-grid" id="dashboard-grid">
    <div class="dashboard-column">
        <div class="dashboard-box">
            <h2 class="dashboard-header">Players</h2>
            <div id="player-list"></div>
        </div>
        <div class="dashboard-box">
            <h2 class="dashboard-header">Options</h2>
            <button class="greybutton" id="start-stop" onclick="startStop()">Start</button>
        </div>
    </div>
    <div class="dashboard-column" style="overflow: hidden;">
        <div class="dashboard-box" style="overflow: hidden;">
            <h2 class="dashboard-header">Log</h2>
            <div id="logDiv" style="overflow-y: auto; height: 90%" class="log-box">
            </div>
        </div>
    </div>
</div>

<usericon></usericon>
</body>
</html>
