<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <link rel="stylesheet" href="main.css">
    <link rel="icon" type="image/x-icon" href="icon.png">
</head>
<body>
<script type="text/javascript">
    let generalStream = new EventSource("%base%/event-stream", {
        withCredentials: true
    });
    generalStream.addEventListener("clear_logs", (e) => {
        document.getElementById("logDiv").innerHTML = "";
        document.getElementById("logDiv").dataset.hasScrolled = false;
    });
    generalStream.onmessage = (event) => {
        console.log("Unknown message:", event.id);
    };
    generalStream.onerror = (error) => {
        console.error("Error in EventSource:", error);
    };

    let logsStream = new EventSource("%base%/logs-stream", {
        withCredentials: true
    });
    logsStream.onmessage = (event) => {
        console.log("Received message:", event.data);
        let setScroll = false;
        let oldHeight = document.getElementById("logDiv").clientHeight;
        if((document.getElementById("logDiv").scrollTop) / (document.getElementById("logDiv").scrollHeight - document.getElementById("logDiv").clientHeight) === 1) setScroll = true;

        const lines = event.data.replaceAll("\\n", "\n").split("\n");

        const niceLines = lines.map(line => {
            if (line.includes("Render")) {
                return `<p style="color: cyan">${line}</p>`;
            } else if (line.includes("Server")) {
                return `<p style="color: lime">${line}</p>`;
            }
            return `<p>${line}</p>`;
        });

        document.getElementById('logDiv').innerHTML += niceLines.join("");

        if(oldHeight !== document.getElementById("logDiv").scrollHeight && !document.getElementById("logDiv").dataset.hasScrolled) {
            setScroll = true;
            document.getElementById("logDiv").dataset.hasScrolled = true;
        }
        if(setScroll) document.getElementById("logDiv").scrollTop = 9999999999;
    };
    logsStream.onerror = (error) => {
        console.error("Error in EventSource:", error);
    };
</script>
<script src="%base%/password.js"></script>
<sitetitle></sitetitle>
<sidebar></sidebar>
<h1>Your Account</h1>
<div style="display: flex; align-items: center; gap: 10px;">
<p>Status </p><div class="circle" style="width: 10px; height: 10px; background-color: red; border-radius: 50%;"></div>
</div>
<div class="dashboard-grid" id="dashboard-grid">
    <div class="dashboard-column">
        <div class="dashboard-box"></div>
        <div class="dashboard-box">
            <h2 class="dashboard-header">Options</h2>
        </div>
    </div>
    <div class="dashboard-column" style="overflow: hidden;">
        <div class="dashboard-box" style="overflow: hidden;">
            <h2 class="dashboard-header">Log</h2>
            <div id="logDiv" style="overflow-y: auto; height: 90%" class="log-box">
            </div>
        </div>
    </div>
</div>

<usericon></usericon>
</body>
</html>
