<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account</title>
    <link rel="stylesheet" href="main.css">
    <link rel="icon" type="image/x-icon" href="icon.png">
</head>
<body>
<script type="text/javascript">
    function checkStatus() {
        console.log("Checking status");

        const request = new XMLHttpRequest();
        request.open("GET", "api/account");
        request.onload = async function () {
            if(request.status === 200) {
                json = JSON.parse(request.responseText);

                const formatter = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                });
                document.getElementById("_name").textContent = "Name: "+json.name;
                document.getElementById("_balance").textContent = "Balance: "+formatter.format(json.balance);
                document.getElementById("_discordId").textContent = "Discord ID: "+json.discordId;
            }
        }
        request.send();
    }

    window.addEventListener("load", () => {
        //login();
        setInterval(checkStatus, 10000)
        checkStatus();
    });
</script>
<script src="%base%/password.js"></script>
<sitetitle></sitetitle>
<h1>Your Account</h1>
<div style="display: flex; align-items: center; gap: 10px;">
<p>Status </p><div class="circle" style="width: 10px; height: 10px; background-color: red; border-radius: 50%;"></div>
</div>
<div style="display: grid; width: 100%; height: calc((100vh*0.8) - 100px)">
<div style="grid-column: 1">
<div class="square" style="height: 50%;
margin: 10px;
  width: 50px;
  background-color: #555;
"></div>
<div class="square2" style="height: 50%;
  width: calc(100% - 20px);
  margin: 10px;
  background-color: #555;
"></div>
</div>
<div class="square3" style="height: 50%;
  width: 50px;
  background-color: #555;
  margin: 10px;
  grid-column: 2
">
    <h2>Log</h2>
</div>
</div>

<usericon></usericon>
</body>
</html>
